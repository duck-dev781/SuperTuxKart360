name: Verify official STK runtime assets

on:
  workflow_dispatch:
  push:
    paths:
      - "Build/Fetch-STK-Assets.sh"
      - "Docs/ASSETS.md"
      - ".github/workflows/stk-assets-check.yml"
  pull_request:
    paths:
      - "Build/Fetch-STK-Assets.sh"
      - "Docs/ASSETS.md"
      - ".github/workflows/stk-assets-check.yml"

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SuperTuxKart360
        uses: actions/checkout@v7

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Fetch official source and runtime assets
        run: bash Build/Fetch-STK-Assets.sh

      - name: Show exact upstream revisions
        run: cat External/stk-upstream-lock.txt

      - name: Package pinned upstream inputs
        run: |
          tar --exclude='stk-code/.git' --exclude='stk-assets/.svn' \
            -czf stk-upstream-inputs.tar.gz \
            -C External stk-code stk-assets stk-upstream-lock.txt

      - name: Upload upstream source and runtime assets
        uses: actions/upload-artifact@v7
        with:
          name: stk-upstream-inputs
          path: stk-upstream-inputs.tar.gz
          if-no-files-found: error
          retention-days: 30
