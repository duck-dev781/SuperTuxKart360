name: Validate official STK SPM assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "STK/Source/SPMReader.*"
      - "STK/Source/TrackDataReader.*"
      - "STK/Tests/track_asset_probe.cpp"
      - "STK/Tests/spm_asset_probe.cpp"
      - "STK/Tests/spm_reader_test.cpp"
      - "Docs/STK_SPM_FORMAT.md"
      - ".github/workflows/stk-spm-asset-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Parse official kart and track meshes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure Subversion is available
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get install -y subversion
          fi
          svn --version --quiet

      - name: Fetch selected official assets at the recorded revision
        run: |
          set -euo pipefail
          base="https://svn.code.sf.net/p/supertuxkart/code/stk-assets"
          revision="18627"
          mkdir -p Build/AssetProbe/licenses
          svn export --quiet -r "$revision" "$base/karts/adiumy/adiumy.spm" Build/AssetProbe/adiumy.spm
          svn export --quiet -r "$revision" "$base/tracks/black_forest/black_forest_track.spm" Build/AssetProbe/black_forest_track.spm
          svn export --quiet -r "$revision" "$base/karts/adiumy/kart.xml" Build/AssetProbe/adiumy-kart.xml
          svn export --quiet -r "$revision" "$base/karts/adiumy/materials.xml" Build/AssetProbe/adiumy-materials.xml
          svn export --quiet -r "$revision" "$base/tracks/black_forest/track.xml" Build/AssetProbe/black_forest-track.xml
          svn export --quiet -r "$revision" "$base/tracks/black_forest/scene.xml" Build/AssetProbe/black_forest-scene.xml
          svn export --quiet -r "$revision" "$base/tracks/black_forest/quads.xml" Build/AssetProbe/black_forest-quads.xml
          svn export --quiet -r "$revision" "$base/tracks/black_forest/graph.xml" Build/AssetProbe/black_forest-graph.xml
          svn export --quiet -r "$revision" "$base/karts/adiumy/licenses.txt" Build/AssetProbe/licenses/adiumy-licenses.txt
          svn export --quiet -r "$revision" "$base/tracks/black_forest/licenses.txt" Build/AssetProbe/licenses/black_forest-licenses.txt
          sha256sum Build/AssetProbe/*.spm
          echo "=== Official asset repository root ==="
          svn ls -r "$revision" "$base/" | sed -n '1,100p'
          echo "=== Official Black Forest folder ==="
          svn ls -r "$revision" "$base/tracks/black_forest" | sed -n '1,100p'
          echo "=== Official Adiumy folder ==="
          svn ls -r "$revision" "$base/karts/adiumy" | sed -n '1,100p'
          echo '=== Black Forest track quads ==='
          sed -n '1,180p' Build/AssetProbe/black_forest-quads.xml
          echo '=== Black Forest track graph ==='
          sed -n '1,140p' Build/AssetProbe/black_forest-graph.xml
          echo '=== Black Forest track config ==='
          sed -n '1,140p' Build/AssetProbe/black_forest-track.xml
          echo '=== Adiumy kart config ==='
          sed -n '1,140p' Build/AssetProbe/adiumy-kart.xml
          echo '=== Black Forest scene config ==='
          sed -n '1,100p' Build/AssetProbe/black_forest-scene.xml
          echo '=== First scene static-object records ==='
          grep -o '<static-object[^>]*>' Build/AssetProbe/black_forest-scene.xml | sed -n '1,50p'

      - name: Compile SPM asset probe
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            STK/Source/SPMReader.cpp STK/Tests/spm_asset_probe.cpp \
            -o spm-asset-probe

      - name: Parse the official Adiumy kart and Black Forest track meshes
        run: |
          ./spm-asset-probe \
            Build/AssetProbe/adiumy.spm \
            Build/AssetProbe/black_forest_track.spm

      - name: Compile track XML asset probe
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            STK/Source/TrackDataReader.cpp STK/Tests/track_asset_probe.cpp \
            -o track-asset-probe

      - name: Parse the official Black Forest track graph
        run: |
          ./track-asset-probe \
            Build/AssetProbe/black_forest-quads.xml \
            Build/AssetProbe/black_forest-graph.xml \
            Build/AssetProbe/black_forest-track.xml

      - name: Inspect embedded SPM material texture names
        run: |
          echo "=== Adiumy SPM strings ==="
          strings -n 3 Build/AssetProbe/adiumy.spm | sed -n '1,80p'
          echo "=== Black Forest SPM strings ==="
          strings -n 3 Build/AssetProbe/black_forest_track.spm | sed -n '1,160p'

      - name: Summarize Black Forest scene XML structure
        run: |
          grep -o '<[A-Za-z0-9_-]*' Build/AssetProbe/black_forest-scene.xml | sort | uniq -c
          grep -o 'model="[^"]*"' Build/AssetProbe/black_forest-scene.xml | sed -n '1,80p'
          grep -o '<static-object[^>]*>' Build/AssetProbe/black_forest-scene.xml | sed -n '1,50p'
