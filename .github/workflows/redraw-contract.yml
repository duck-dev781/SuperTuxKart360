name: Redraw contract checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-interface:
    name: Compile Redraw interface contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile C++03 interface test
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            Redraw/Tests/renderer_contract_test.cpp \
            -o renderer-contract-test

      - name: Run interface test
        run: ./renderer-contract-test

      - name: Compile Xbox 360 controller adapter test
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            Platform/Xbox360/Tests/xbox360_input_adapter_test.cpp \
            -o xbox360-input-adapter-test

      - name: Run Xbox 360 controller adapter test
        run: ./xbox360-input-adapter-test

      - name: Compile STK SPM reader test
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            STK/Source/SPMReader.cpp STK/Tests/spm_reader_test.cpp \
            -o spm-reader-test

      - name: Run STK SPM reader test
        run: ./spm-reader-test

      - name: Compile STK-to-Redraw bridge test
        run: |
          g++ -std=c++03 -Wall -Wextra -Werror -pedantic \
            STK/Source/SPMReader.cpp STK/Source/SPMRedrawBridge.cpp \
            STK/Tests/spm_redraw_bridge_test.cpp \
            -o spm-redraw-bridge-test

      - name: Run STK-to-Redraw bridge test
        run: ./spm-redraw-bridge-test
